<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Student Marks Form</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        fieldset {
            width: 450px;
            background-color: white;
            padding: 20px;
            border: 2px solid black;
        }

        legend {
            font-size: 20px;
        }

        input, select {
            padding: 8px;
            margin-top: 5px;
        }

        output {
            font-weight: bold;
            color: blue;
        }

    </style>

</head>

<body>

    <fieldset>

        <legend><b>Student Marks Calculator</b></legend>

        <form
            action="/action_page.php"
            oninput="x.value=(parseInt(m1.value)+parseInt(m2.value)+parseInt(m3.value))/3">

            <label>Student Name</label><br>
            <input type="text" id="name" placeholder="Enter your name"><br><br>

            <label>Enter Subject Marks</label><br>

            <select name="subject1" id="subject1">
                <option value="Maths">Maths</option>
                <option value="English">English</option>
                <option value="Science">Science</option>
            </select>

            <input type="number" id="m1" name="m1"><br><br>

            <select name="subject2" id="subject2">
                <option value="Maths">Maths</option>
                <option value="English">English</option>
                <option value="Science">Science</option>
            </select>

            <input type="number" id="m2" name="m2"><br><br>

            <select name="subject3" id="subject3">
                <option value="Maths">Maths</option>
                <option value="English">English</option>
                <option value="Science">Science</option>
            </select>

            <input type="number" id="m3" name="m3"><br><br>

            Average Marks:
            <output name="x" for="m1 m2 m3"></output>

        </form>

    </fieldset>

</body>

</html>
